<footer class="footer">
    <div class="container">
        <div class="row mt-0 mb-0">
            <div class="col-6">
                <div>
                    Last updated: {{ "now" | date: "%b %Y" }}
                </div>
            </div>
            <div class="col-6">
                <div class="text-right">
                    {% assign current_year = site.time | date: "%Y" %}{{ site.data.display.footer_text | replace: "%year%", current_year }}
                </div>
            </div>
        </div>
    </div>
</footer>
