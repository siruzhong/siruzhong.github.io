<nav class="navbar navbar-expand-md navbar-light fixed-top" aria-label="Primary navigation">
    <div class="container">
        <a class="navbar-brand" href="{{ '/' | relative_url }}" aria-label="Siru Zhong home">
            <span class="brand-name">{{ site.data.profile.navbar_name }}</span>
            <span class="brand-divider" aria-hidden="true"></span>
            <img src="{{ '/assets/images/badges/HKUST_GZ_full.png' | relative_url }}" alt="HKUST(GZ)">
        </a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarResponsive" aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
            <i class="fas fa-bars" aria-hidden="true"></i>
        </button>

        <div class="collapse navbar-collapse" id="navbarResponsive">
            <ul class="navbar-nav ml-auto">
                {% for item in site.data.navigation.pages %}

            </ul>
