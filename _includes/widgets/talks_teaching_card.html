<!-- Talks -->
<div class="row mb-4" id="talks-teaching">
    <div class="col-12">
        <div class="card" id="talks">
            <h6 class="section-card-header"><i class="fas fa-microphone"></i>Talks</h6>
            <div class="section-card-body">
                <ul class="talk-list">
                    {% assign talks = site.data.profile.talks | sort: "date" | reverse %}
                    {% for talk in talks %}
                    <li>
                        <div class="talk-row">
                            <div>
                                <div class="talk-title">{{ talk.title }}{% if talk.url %} <a href="{{ talk.url }}" target="_blank" rel="noopener">[link]</a>{% endif %}</div>
                                {% if talk.location %}
                                <div class="talk-location">{{ talk.location }}</div>
                                {% endif %}
                            </div>
                            <div class="date-label">{{ talk.date }}</div>
                        </div>
                    </li>
                    {% endfor %}
                </ul>
            </div>
        </div>
    </div>
</div>
