<div class="experience-section">
    <div class="card career-card service-card open-section">
        <div class="section-card-body">
            <section class="activity-section resume-section" aria-labelledby="awards">
                <h2 class="section-subheading section-heading" id="awards">Awards</h2>
                <ul class="dated-list">
                    {% for item in site.data.profile.awards %}
                    <li class="resume-list-entry"><span class="resume-date">{{ item.date }}</span><span>{{ item.name }}</span></li>
                    {% endfor %}
                </ul>
            </section>
        </div>
    </div>
</div>
