bio: >-
  <p>
    I am a Ph.D. candidate at <a href="https://dsa.hkust-gz.edu.cn/" target="_blank">The Hong Kong University of Science and Technology</a>, Guangzhou Campus, advised by <a href="https://yuxuanliang.com/" target="_blank">Prof. Yuxuan Liang</a>. I am visiting <a href="https://www.tsinghua.edu.cn/" target="_blank">Tsinghua University</a> and the <a href="https://www.nsccsz.cn/" target="_blank">National Supercomputing Center in Shenzhen</a>, hosted by <a href="https://www.thuhpgc.net/author/haohuan-fu/" target="_blank">Prof. Haohuan Fu</a>. I also receive guidance from <a href="https://scholar.google.com/citations?user=-oTraZ4AAAAJ" target="_blank">Prof. James T. Kwok</a> at <a href="https://hkust.edu.hk/" target="_blank">HKUST</a>.
  </p>

  <p>
    I study how models learn from evolving temporal and multimodal observations, with a current focus on maintaining and revising world states for reliable prediction and decision-making. Beyond academia, I have worked on temporal data infrastructure at <a href="https://www.tencent.com/" target="_blank" rel="noopener">Tencent</a>, multimodal perception at <a href="https://www.xpeng.com/" target="_blank" rel="noopener">XPENG</a>, spatio-temporal foundation models at <a href="https://www.huawei.com/" target="_blank" rel="noopener">Huawei</a>, and long-term memory at <a class="no-break" href="https://betainf.com/" target="_blank" rel="noopener">Beta Infinity</a>.
  </p>
