bio: >-
  <p style="margin-bottom: 5px;">
    Hi there, I'm Siru Zhong, a Ph.D. Candidate at <a href="https://dsa.hkust-gz.edu.cn/" target="_blank">The Hong Kong University of Science and Technology, Guangzhou</a>, advised by <a href="https://yuxuanliang.com/" target="_blank">Prof. Yuxuan Liang</a> and <a href="https://facultyprofiles.hkust-gz.edu.cn/faculty-personal-page/YUE-Yang/yangyue" target="_blank">Prof. Yang Yue</a>. I am also fortunate to receive guidance from <a href="https://scholar.google.com/citations?user=-oTraZ4AAAAJ" target="_blank">Prof. James T. Kwok</a> and <a href="https://scholar.google.com/citations?user=iHevumsAAAAJ" target="_blank">Prof. Jeffrey Xu Yu</a>. I am currently visiting <a href="https://www.tsinghua.edu.cn/" target="_blank">Tsinghua University</a> and the <a href="https://www.nsccsz.cn/" target="_blank">National Supercomputing Center in Shenzhen</a>, hosted by <a href="https://www.thuhpgc.net/author/haohuan-fu/" target="_blank">Prof. Haohuan Fu</a>.
  </p>

  <p style="margin-bottom: 5px;">
    My research centers on <em>Spatio-Temporal Intelligence</em>, with a focus on time series modeling, foundation models, AI for dynamic real-world environments. Beyond academia, I have substantial industry experience: temporal data infrastructure at <a href="https://www.tencent.com/" target="_blank">Tencent</a>, multimodal perception at <a href="https://www.xpeng.com/" target="_blank">XPeng Motors</a>, foundation models at <a href="https://www.huawei.com/" target="_blank">Huawei</a>, and spatio-temporal memory for Ego-Stream Video at <a href="https://betainf.com/" target="_blank">Beta Infinity</a>.
  </p>

  <p style="margin-bottom: 5px;">
    I am honored to be a consecutive recipient of the HKUST (GZ) DSA Excellent Research Award, a Tutorial Speaker for MM4ST @ MM 2025 &amp; ICME 2026 and MM4TS @ AAAI 2026, a Web Master for WebST 2025 &amp; UrbComp 2025, and a reviewer/PC member for venues including NeurIPS, ICLR, KDD, ACM MM, AAAI, PAKDD, IEEE TPAMI, FARS, MILETS, IJITDM, and Neurocomputing.
  </p>
