# Homepage research overview. The three thrusts follow one storyline:
# represent temporal dynamics -> stay reliable under shift -> remember what matters from the past.
# The (i)/(ii)/(iii) questions in the intro map to thrusts I/II/III below.
# Each thrust lists every first-author and co-first-author paper in that area, rendered in the
# order given here (accepted work first, then preprints). The complete list lives on /publications.html.
intro: >-
  My work asks three questions: (i) how to represent temporal dynamics, (ii) how to stay reliable when data shift, and (iii) what to remember from the past.

