# Three research areas develop in parallel and are organized by research question.
# Representation covers predictive temporal, spatial, and multimodal structure;
# adaptation covers context, data reliability, domain experience, and expert routing;
# memory covers retaining, accessing, and evaluating historical evidence.
# Scientific-agent systems and KV-cache optimization remain additional work.
# Order: first author, equal-first author, then other authorship; newest first within each group.
